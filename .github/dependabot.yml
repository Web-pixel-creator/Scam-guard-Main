# Dependabot security and version updates
# https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Only open PRs for security updates (not all version bumps)
    open-pull-requests-limit: 10
    # Group minor/patch updates into a single PR to reduce noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Prefix PR titles for easy filtering
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
