name: Production Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled workflows; the monitor itself is idempotent.
    - cron: "*/30 * * * *"

concurrency:
  group: prod-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    name: production smoke monitor
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PUBLIC_APP_URL: https://scam-guard-main-production.up.railway.app
      MONITOR_LABEL: github-scheduled-production
      MONITOR_TIMEOUT_MS: "8000"
      MONITOR_MAX_PENDING_UPDATES: "0"
      MONITOR_STALE_TELEGRAM_ERROR_MS: "900000"
      MONITOR_ALERT_ON_WARN: "false"
      MONITOR_FAIL_ON_WARN: "false"
      MONITOR_REQUIRE_SECRET_CHECKS: "true"
      TELEGRAM_UPDATE_DELIVERY_MODE: polling

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run monitor
        env:
          MONITOR_ALERT_CHAT_ID: ${{ secrets.MONITOR_ALERT_CHAT_ID }}
          MONITOR_ALERT_BOT_TOKEN: ${{ secrets.MONITOR_ALERT_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: bun scripts/prod-monitor.ts "$PUBLIC_APP_URL"
