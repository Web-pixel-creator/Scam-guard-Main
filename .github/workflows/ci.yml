name: CI

# Runs lint, type-check, the full test suite (Vitest + fast-check), the production
# build, and database migration checks on every push to main and pull request.
# Keeps regressions out of main - nothing merges without a green build.

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ci-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests (Vitest + fast-check)
        run: bun run test:run

      - name: Production build
        run: bun run build

  coverage:
    name: coverage-thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for V8 coverage
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install pinned coverage provider without changing locks
        run: bun add --dev --no-save --ignore-scripts @vitest/coverage-v8@4.1.12

      - name: Enforce repository coverage floor
        run: >-
          node node_modules/vitest/vitest.mjs run --coverage
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=80
          --coverage.thresholds.branches=75
          --coverage.thresholds.functions=85
          --coverage.thresholds.lines=80

  database:
    name: database-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.104.0

      - name: Apply migrations to a clean local database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Database tests (pgTAP)
        run: supabase test db --local

      - name: Atomic media consent concurrency proof
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          command -v psql >/dev/null
          status_env="$(mktemp)"
          trap 'rm -f "$status_env"' EXIT
          supabase status -o env > "$status_env"

          read_status_value() {
            local wanted="$1"
            local line=""
            local candidate
            while IFS= read -r candidate; do
              candidate="${candidate%$'\r'}"
              if [[ "$candidate" == "$wanted="* ]]; then
                line="$candidate"
                break
              fi
            done < "$status_env"
            [[ -n "$line" ]] || return 1

            local value="${line#*=}"
            if [[ ${#value} -ge 2 && "${value:0:1}" == '"' && "${value: -1}" == '"' ]]; then
              value="${value:1:${#value}-2}"
            elif [[ ${#value} -ge 2 && "${value:0:1}" == "'" && "${value: -1}" == "'" ]]; then
              value="${value:1:${#value}-2}"
            fi
            [[ -n "$value" ]] || return 1
            printf '%s' "$value"
          }

          database_url="$(read_status_value DB_URL)"
          proof_output="$(
            SUPABASE_DB_URL="$database_url" bun scripts/local-media-consent-concurrency-proof.ts
          )"
          printf '%s\n' "$proof_output"
          grep -Fqx \
            'Local media-consent concurrency proof: PASS (2 concurrent claims + 1 replay, 1 winner, 0 media calls)' \
            <<< "$proof_output"
          ordering_output="$(
            SUPABASE_DB_URL="$database_url" bun scripts/local-media-consent-concurrency-proof.ts --ordering
          )"
          printf '%s\n' "$ordering_output"
          grep -Fqx \
            'Local media-consent ordering proof: PASS (both arrival orders, expired stale miss, fresh renewal, cleanup verified)' \
            <<< "$ordering_output"
          retention_output="$(
            SUPABASE_DB_URL="$database_url" bun scripts/local-media-consent-concurrency-proof.ts --retention
          )"
          printf '%s\n' "$retention_output"
          grep -Fqx \
            'Local retention concurrency proof: PASS (singleton, bounded lock wait, rollback, fresh consent, cleanup verified)' \
            <<< "$retention_output"
          appeal_output="$(
            SUPABASE_DB_URL="$database_url" bun scripts/local-appeal-concurrency-proof.ts
          )"
          printf '%s\n' "$appeal_output"
          grep -Fqx \
            'Local appeal concurrency proof: PASS (8 observed lock barriers; duplicate/distinct/rotation/rollback/admin/replay; cleanup verified)' \
            <<< "$appeal_output"
          ocr_output="$(
            SUPABASE_DB_URL="$database_url" bun scripts/local-web-ocr-concurrency-proof.ts
          )"
          printf '%s\n' "$ocr_output"
          grep -Fqx \
            'Local Web OCR concurrency proof: PASS (4 observed lock barriers; commit/rollback/expiry/timeout/prune/replay/fresh; cleanup verified; 0 provider calls)' \
            <<< "$ocr_output"
