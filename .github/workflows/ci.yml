name: CI

# Runs lint, type-check, the full test suite (Vitest + fast-check), the production
# build, and database migration checks on every push to main and pull request.
# Keeps regressions out of main - nothing merges without a green build.

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ci-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for V8 coverage
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests (Vitest + fast-check)
        run: bun run test:run

      - name: Production build
        run: bun run build

  coverage:
    name: coverage-thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install pinned coverage provider without changing locks
        run: bun add --dev --no-save --ignore-scripts @vitest/coverage-v8@4.1.8

      - name: Enforce repository coverage floor
        run: >-
          node node_modules/vitest/vitest.mjs run --coverage
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=80
          --coverage.thresholds.branches=75
          --coverage.thresholds.functions=85
          --coverage.thresholds.lines=80

  database:
    name: database-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.104.0

      - name: Apply migrations to a clean local database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Database tests (pgTAP)
        run: supabase test db --local
