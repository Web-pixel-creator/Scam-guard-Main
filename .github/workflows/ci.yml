name: CI

# Runs lint, type-check, the full test suite (Vitest + fast-check), the production
# build, and database migration checks on every push to main and pull request.
# Keeps regressions out of main — nothing merges without a green build.

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests (Vitest + fast-check)
        run: bun run test:run

      - name: Production build
        run: bun run build

  database:
    name: migrations · schema lint · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Apply migrations to a clean local database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Database tests (pgTAP)
        run: supabase test db --local
